    main = 'odc.TaskActionsTest'
}
check.dependsOn verifyTaskActions

// Stage 1 catalog and pool regression.
task verifyPoolResources(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
