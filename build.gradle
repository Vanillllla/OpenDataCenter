// Minimal ABI declarations only for javac; the actual HBM mod supplies them at runtime.
sourceSets.main.java.srcDir 'src/compileOnlyHbm/java'
jar {
    exclude 'api/hbm/**', 'com/hbm/**'
    doLast {
        if (!zipTree(archivePath).matching { include 'api/hbm/**', 'com/hbm/**' }.isEmpty())
            throw new GradleException('HBM compile-only declarations leaked into mod jar')
    }
}
